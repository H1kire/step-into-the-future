name: Deploy production and test previews to GitHub Pages

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test
          path: testing

      - name: Prepare combined Pages site
        run: |
          mkdir -p public public/test
          tar --exclude='.git' --exclude='.github' -cf - -C production . | tar -xf - -C public
          tar --exclude='.git' --exclude='.github' -cf - -C testing . | tar -xf - -C public/test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
